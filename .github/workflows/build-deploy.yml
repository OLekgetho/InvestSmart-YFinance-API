name: Build and Push Docker

on:
  push:
    branches:
      - Dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set lowercase branch name
        run: echo "BRANCH=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/yfinanceapi:${{ env.BRANCH }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/yfinanceapi:${{ env.BRANCH }}

      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/yfinanceapi:${{ env.BRANCH }}